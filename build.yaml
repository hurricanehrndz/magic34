# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano//zmk
    shield: magic34_left
  - board: nice_nano//zmk
    shield: magic34_right
  - board: nice_nano//zmk
    shield: settings_reset
  # Dongle builds: flash the dongle, and the left half as a peripheral.
  # The right half uses the magic34_right build above in both setups.
  - board: nice_nano//zmk
    shield: magic34_dongle
  - board: nice_nano//zmk
    shield: magic34_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: magic34_left_peripheral
